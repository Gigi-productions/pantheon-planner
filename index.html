/* ---------- auto assign ---------- */
function autoAssign(e){
  var parts=e.participants.map(member).filter(Boolean).sort(function(a,b){return b.power-a.power});
  if(e.type==='vikings'&&e.roles.length&&!e.roles[0].rest){var lc=+e.roles[0].count||0,onl=parts.filter(function(m){return vikAvail(m)==='on'}).slice(0,lc);parts=onl.concat(parts.filter(function(m){return onl.indexOf(m)<0}))}
  var max=+e.max||0;
  var main=max>0?parts.slice(0,max):parts.slice();
  var reserve=parts.slice(main.length);
  var asg={},idx=0,prevTotals=null;
  e.roles.forEach(function(r,ri){
    var left=main.length-idx,n;
    if(r.rest){
      var later=0;for(var j=ri+1;j<e.roles.length;j++)if(!e.roles[j].rest)later+=(+e.roles[j].count||0);
      n=Math.max(0,left-later);
    }else n=Math.min(+r.count||0,left);
    var slice=main.slice(idx,idx+n);idx+=n;
    var k=Math.max(1,+r.groups||1);
    var totals=(r.link&&prevTotals&&prevTotals.length===k)?prevTotals.slice():new Array(k).fill(0);
    var cap=Math.ceil(slice.length/k),counts=new Array(k).fill(0);
    slice.forEach(function(m){
      var best=-1;for(var g=0;g<k;g++){if(counts[g]>=cap)continue;if(best<0||totals[g]<totals[best])best=g}
      counts[best]++;totals[best]+=m.power;asg[m.id]={role:r.id,group:best};
    });
    prevTotals=totals;
  });
  main.slice(idx).forEach(function(m){asg[m.id]={role:'reserve',group:0}});
  reserve.forEach(function(m){asg[m.id]={role:'reserve',group:0}});
  e.assignment=asg;
}

/* ---------- garrison groups (players who reinforce each other) ---------- */
function garrisonPool(e){return e.participants.map(member).filter(function(m){if(!m)return false;var a=e.assignment&&e.assignment[m.id];return !(a&&a.role==='reserve')}).sort(function(a,b){return b.power-a.power})}
function makeGarrison(e,size){
  var pool=garrisonPool(e),n=pool.length;size=Math.max(2,Math.min(10,+size||3));
  var k=Math.max(1,Math.ceil(n/size)),gar={},cap=Math.ceil(n/k),tot=new Array(k).fill(0),cnt=new Array(k).fill(0);
  /* Viking Vengeance: place online players first, one round at a time, so every group gets its share of online players */
  var vik=e.type==='vikings',cls=function(m){if(!vik)return 0;var a=vikAvail(m);return a==='on'?0:a==='part'?1:2};
  if(vik)pool=pool.slice().sort(function(a,b){return cls(a)-cls(b)||b.power-a.power});
  var cntC=[new Array(k).fill(0),new Array(k).fill(0),new Array(k).fill(0)];
  pool.forEach(function(m){var c=cls(m),best=-1;for(var g=0;g<k;g++){if(cnt[g]>=cap)continue;if(best<0||cntC[c][g]<cntC[c][best]||(cntC[c][g]===cntC[c][best]&&tot[g]<tot[best]))best=g}
    if(!vik){best=-1;for(var g2=0;g2<k;g2++){if(cnt[g2]>=cap)continue;if(best<0||tot[g2]<tot[best])best=g2}}
    cnt[best]++;cntC[c][best]++;tot[best]+=m.power;gar[m.id]=best});
  /* even out: swap players between groups while that brings both totals closer to the average */
  var G=[];for(var g0=0;g0<k;g0++)G.push([]);pool.forEach(function(m){G[gar[m.id]].push(m)});
  var avg=0;tot.forEach(function(t){avg+=t});avg/=k;
  for(var pass=0;pass<30;pass++){var imp=false;
    for(var x=0;x<k;x++)for(var y=x+1;y<k;y++)for(var i=0;i<G[x].length;i++)for(var j=0;j<G[y].length;j++){
      if(cls(G[x][i])!==cls(G[y][j]))continue;var d=G[x][i].power-G[y][j].power;if(!d)continue;var nx=tot[x]-d,ny=tot[y]+d;
      if((nx-avg)*(nx-avg)+(ny-avg)*(ny-avg)<(tot[x]-avg)*(tot[x]-avg)+(tot[y]-avg)*(tot[y]-avg)-1){var t1=G[x][i];G[x][i]=G[y][j];G[y][j]=t1;tot[x]=nx;tot[y]=ny;imp=true}}
    if(!imp)break}
  G.forEach(function(list,gi){list.forEach(function(m){gar[m.id]=gi})});
  e.gar=gar;e.garN=k;e.garSize=size;return k;
}
function garrisonHtml(e,parts){
  if(!parts.length)return '';
  var has=e.gar&&e.garN>0,size=e.garSize||3;
  var h='<div class="card"><div class="row" style="margin-bottom:6px"><h2 class="grow" style="margin:0">🛡 Garrison groups</h2>'+(has?'<button class="btn sm ghost" data-copy="gar" title="Copy all garrison groups">📋 Copy all</button>':'')
   +'<span class="row eo" style="gap:6px"><label class="small muted">Group size</label><input type="number" id="garsize" min="2" max="10" value="'+size+'" style="width:64px"><button class="btn'+(has?'':' gold')+' sm" data-act="garmake">'+(has?'Remake groups':'Make garrison groups')+'</button>'+(has?'<button class="btn sm ghost danger" data-act="garclear">Remove</button>':'')+'</span></div>'
   +'<p class="muted small" style="margin:0 0 10px">Small groups of players who reinforce (garrison) each other’s cities. Each group gets a mix of strong and weaker players with about the same total power'+(e.type==='vikings'?', and the 🟢 online players are spread evenly so every group has someone to reinforce during the elite waves (7, 14, 17)':'')+'. Separate from the roles above — everyone keeps their role.</p>';
  if(!has)return h+'<p class="small muted" style="margin:0">No garrison groups yet'+(isLocked()?'.':' — choose a group size and click “Make garrison groups”.')+'</p></div>';
  var groups=[];for(var g=0;g<e.garN;g++)groups.push([]);var none=[];
  garrisonPool(e).forEach(function(m){var gi=e.gar[m.id];if(gi==null||gi>=e.garN)none.push(m);else groups[gi].push(m)});
  function sel(m,cur){var o='<select data-gmove="'+m.id+'" title="Move">';for(var i=0;i<e.garN;i++)o+='<option value="'+i+'"'+(cur===i?' selected':'')+'>Garrison '+(i+1)+'</option>';return o+'<option value=""'+(cur==null?' selected':'')+'>No group</option></select>'}
  h+='<div class="groups" style="border-radius:10px;overflow:hidden">';
  var anyAv=e.type==='vikings'&&garrisonPool(e).some(function(m){return vikAvail(m)});
  groups.forEach(function(list,i){var on=anyAv?list.filter(function(m){return vikAvail(m)==='on'}).length:-1;h+='<div class="group"><div class="group-h"><b>Garrison '+(i+1)+'</b><span>'+(on>=0?'🟢'+on+' · ':'')+list.length+' · '+fmt(sum(list))+' <button class="copyico" data-copy="gar:'+i+'" title="Copy only this group">📋</button></span></div>';
    list.forEach(function(m){h+='<div class="m">'+availMark(e,m)+'<span class="n">'+esc(m.name)+'</span>'+(m.tc?'<span class="lgtag">TC'+m.tc+'</span>':'')+'<span class="p">'+fmt(m.power)+'</span>'+sel(m,i)+'</div>'});
    if(!list.length)h+='<div class="muted small">Empty</div>';h+='</div>'});
  h+='</div>';
  if(none.length){h+='<div class="small" style="margin-top:10px"><b style="color:var(--gold2)">Not in a group yet:</b> ';h+=none.map(function(m){return '<span class="chip" style="margin:2px">'+esc(m.name)+' '+sel(m,null)+'</span>'}).join(' ')+'</div>'}
  return h+'</div>';
}
function vikAvail(m){var p='';(cloud.signups||[]).forEach(function(s){if(s.vikings&&s.memberId===m.id)p=s.vikings});return p||m.vikings||''}
function availMark(e,m){if(e.type!=='vikings')return '';var a=vikAvail(m);return a?'<span class="avail" title="Viking Vengeance: '+CESN[a]+'">'+CESI[a]+'</span>':'<span class="avail" title="No answer yet">❔</span>'}

  var g={on:[],part:[],off:[],none:[]};state.members.filter(function(m){return m.active!==false}).sort(function(a,b){return b.power-a.power}).forEach(function(m){var a=vikAvail(m);(g[a]||g.none).push(m)});

  h+='<div class="row" style="gap:16px;margin-bottom:8px"><span>🟢 <b>'+g.on.length+'</b> online</span><span>🌓 <b>'+g.part.length+'</b> part of the time</span><span>💤 <b>'+g.off.length+'</b> offline</span><span class="muted">❔ <b>'+g.none.length+'</b> no answer</span></div>';
  [['on','🟢 Online'],['part','🌓 Part of the time'],['off','💤 Offline'],['none','❔ No answer yet']].forEach(function(k){if(g[k[0]].length)h+='<p class="small" style="margin:0 0 6px"><b style="color:var(--gold2)">'+k[1]+':</b> '+g[k[0]].map(function(m){return esc(m.name)}).join(', ')+'</p>'});

  return h+'</div>';
}
function legionOf(m){var p='';(cloud.signups||[]).forEach(function(s){if(s.legion&&s.memberId===m.id)p=s.legion});return p||m.legion||''}

function groupsOf(e,parts){
  var map={};e.roles.forEach(function(r){map[r.id]={role:r,groups:[]};for(var g=0;g<Math.max(1,+r.groups||1);g++)map[r.id].groups.push([])});
  var reserve=[],none=[];
  parts.forEach(function(m){
    var a=e.assignment[m.id];
    if(!a){none.push(m);return}
    if(a.role==='reserve'){reserve.push(m);return}
    var R=map[a.role];if(!R){none.push(m);return}
    var g=Math.min(a.group,R.groups.length-1);R.groups[g].push(m);
  });
  return {map:map,reserve:reserve,none:none};
}
function gName(r,g){return (+r.groups||1)>1?r.groupLabel+' '+(g+1):(r.groupLabel||r.name)}

function moveSelect(e,m,cur){
  var o='<select data-move="'+m.id+'" title="Move">';
  e.roles.forEach(function(r){for(var g=0;g<Math.max(1,+r.groups||1);g++){var v=r.id+':'+g;o+='<option value="'+v+'"'+(cur===v?' selected':'')+'>'+esc(r.name+((+r.groups||1)>1?' · '+(g+1):''))+'</option>'}});
  o+='<option value="reserve:0"'+(cur==='reserve:0'?' selected':'')+'>Reserve</option></select>';return o;
}
function memberRows(e,list,cur){var h='';list.sort(function(a,b){return b.power-a.power}).forEach(function(m){var star=(e.lead===m.id?' 📣':e.backup===m.id?' 🔁':'');h+='<div class="m">'+availMark(e,m)+'<span class="n">'+esc(m.name)+star+'</span>'+(m.tc?'<span class="lgtag" title="Town Center level">TC'+m.tc+'</span>':'')+'<span class="p">'+fmt(m.power)+'</span>'+moveSelect(e,m,cur)+'</div>'});return h||'<div class="muted small">Empty</div>'}
function sum(l){var s=0;l.forEach(function(m){s+=m.power});return s}

function viewAssignment(e,parts){
  var G=groupsOf(e,parts);
  var h='<div class="roles-grid">';
  e.roles.forEach(function(r,i){
    var R=G.map[r.id];var all=[];R.groups.forEach(function(g){all=all.concat(g)});
    h+='<div class="role r-'+(i%5)+'"><div class="role-h"><h3>'+esc(r.name)+'</h3><span class="muted small grow">'+all.length+' players · '+fmt(sum(all))+'</span><button class="btn sm ghost" data-copy="role:'+r.id+'" title="Copy this role with all its groups">📋 Copy</button><p>'+esc(r.desc)+'</p></div><div class="groups">';
    R.groups.forEach(function(list,g){h+='<div class="group"><div class="group-h"><b>'+esc(gName(r,g))+'</b><span>'+fmt(sum(list))+((+r.groups||1)>1?' <button class="copyico" data-copy="grp:'+r.id+':'+g+'" title="Copy only this group">📋</button>':'')+'</span></div>'+memberRows(e,list,r.id+':'+g)+'</div>'});
    h+='</div></div>';
  });
  if(G.reserve.length)h+='<div class="role r-res"><div class="role-h"><h3>Reserve</h3><span class="muted small">'+G.reserve.length+' players</span><p>Substitutes: beyond the max. main players or moved manually.</p></div><div class="groups"><div class="group">'+memberRows(e,G.reserve,'reserve:0')+'</div></div></div>';
  if(G.none.length)h+='<div class="role r-res"><div class="role-h"><h3>Not assigned yet</h3><p>Added later. Move them manually or click Auto-assign again.</p></div><div class="groups"><div class="group">'+memberRows(e,G.none,'')+'</div></div></div>';
  // lane totals when linked
  var linked=e.roles.some(function(r){return r.link});
  if(linked){
    var lab={};e.roles.forEach(function(r,i){var base=r;var k=Math.max(1,+r.groups||1);G.map[r.id].groups.forEach(function(list,g){var key=r.groupLabel+'|'+g+'|'+k;lab[key]=lab[key]||{name:gName(r,g),n:0,p:0};lab[key].n+=list.length;lab[key].p+=sum(list)})});
    var keys=Object.keys(lab).filter(function(k){return true});
    h+='<div class="card"><h2>Total per group (linked roles combined)</h2><div class="stats" style="margin:0">';
    keys.forEach(function(k){h+='<div class="stat"><b>'+fmt(lab[k].p)+'</b><span>'+esc(lab[k].name)+' · '+lab[k].n+' players</span></div>'});
    h+='</div></div>';
  }

function copyFor(e,key){
  var icon=e.type==='tri'?'🛡️':e.type==='swordland'?'⚔️':e.type==='vikings'?'🪓':'📋';
  var head=icon+' '+e.name+' — '+fmtDate(e.date,e.time)+' ('+(e.legion==='all'?'whole alliance':'Legion '+e.legion)+')\n';
  var nm=function(m){return m.name+(e.type==='vikings'&&vikAvail(m)==='part'?' 🌓':'')};
  var parts=e.participants.map(member).filter(Boolean),k=key.split(':');
  if(k[0]==='role'||k[0]==='grp'){
    var G=groupsOf(e,parts),R=G.map[k[1]];if(!R)return '';var r=R.role,t=head+'\n【'+r.name.toUpperCase()+'】\n';
    var idx=k[0]==='grp'?[+k[2]]:R.groups.map(function(_,i){return i});
    idx.forEach(function(g){var list=(R.groups[g]||[]).slice().sort(function(a,b){return b.power-a.power});t+=((+r.groups||1)>1?gName(r,g)+': ':'')+(list.length?list.map(nm).join(', '):'—')+'\n'});
    if(r.desc)t+='\n'+r.desc+'\n';
    var L=member(e.lead);if(L)t+='📣 Caller: '+L.name+'\n';
    return t;
  }
  if(k[0]==='gar'){
    if(!e.gar||!e.garN)return '';var gg=[];for(var i=0;i<e.garN;i++)gg.push([]);
    garrisonPool(e).forEach(function(m){var x=e.gar[m.id];if(x!=null&&x<e.garN)gg[x].push(m)});
    var t2=head+'\n【GARRISON GROUPS — reinforce each other】\n',which=k.length>1?[+k[1]]:gg.map(function(_,i){return i});
    which.forEach(function(i){t2+='Garrison '+(i+1)+': '+(gg[i].length?gg[i].map(nm).join(', '):'—')+'\n'});
    t2+='\nReinforce the other players in your group'+(e.type==='vikings'?' — online members first.':'.')+'\n';
    return t2;
  }
  return '';
}
function briefing(e){
  var parts=e.participants.map(member).filter(Boolean);
  var G=groupsOf(e,parts);
  var icon=e.type==='tri'?'🛡️':e.type==='swordland'?'⚔️':e.type==='vikings'?'🪓':'📋';
  var t=icon+' '+e.name+' — '+fmtDate(e.date,e.time)+' ('+(e.legion==='all'?'whole alliance':'Legion '+e.legion)+')\n';
  var L=member(e.lead),B=member(e.backup);
  if(L||B)t+='📣 Caller: '+(L?L.name:'—')+' | Backup: '+(B?B.name:'—')+'\n';
  e.roles.forEach(function(r){
    t+='\n【'+r.name.toUpperCase()+'】\n';
    G.map[r.id].groups.forEach(function(list,g){
      list.sort(function(a,b){return b.power-a.power});
      t+=((+r.groups||1)>1?gName(r,g)+': ':'')+(list.length?list.map(function(m){return m.name+(e.type==='vikings'&&vikAvail(m)==='part'?' 🌓':'')}).join(', '):'—')+'\n';
    });
  });
  if(e.type==='vikings')t+='\n🌓 = online part of the time\n';
  if(G.reserve.length)t+='\n【RESERVE】\n'+G.reserve.map(function(m){return m.name}).join(', ')+'\n';
  if(e.gar&&e.garN){var gg=[];for(var gi=0;gi<e.garN;gi++)gg.push([]);garrisonPool(e).forEach(function(m){var x=e.gar[m.id];if(x!=null&&x<e.garN)gg[x].push(m.name)});
    t+='\n【GARRISON GROUPS — reinforce each other】\n';gg.forEach(function(l,i){t+='Garrison '+(i+1)+': '+(l.length?l.join(', '):'—')+'\n'})}
  return t;
}

  if(act==='legimport'){var lids=state.members.filter(function(m){return m.active!==false&&legionOf(m)===e.legion}).sort(function(a,b){return b.power-a.power}).map(function(m){return m.id});
    var lrem=e.participants.filter(function(id){return lids.indexOf(id)<0});lrem.forEach(function(id){if(e.assignment)delete e.assignment[id];if(e.gar)delete e.gar[id]});
    var ladd=lids.filter(function(id){return e.participants.indexOf(id)<0}).length;e.participants=lids;
    toast(lids.length+' players signed up for Legion '+e.legion+(ladd?' · '+ladd+' added':'')+(lrem.length?' · '+lrem.length+' removed':'')+' — click Auto-assign');return touch()}
  if(act==='cesimport'){var ids=state.members.filter(function(m){var a=vikAvail(m);return m.active!==false&&(a==='on'||a==='part')}).sort(function(a,b){return b.power-a.power}).map(function(m){return m.id});
    var removed=e.participants.filter(function(id){return ids.indexOf(id)<0});removed.forEach(function(id){if(e.assignment)delete e.assignment[id];if(e.gar)delete e.gar[id]});
    var added=ids.filter(function(id){return e.participants.indexOf(id)<0}).length;e.participants=ids;
    toast(ids.length+' online players in this event'+(added?' · '+added+' added':'')+(removed.length?' · '+removed.length+' removed (offline / no answer)':'')+' — click Auto-assign');return touch()}
  if(act==='cesclear'){if(ui.confirmDel!=='cesclear'){ui.confirmDel='cesclear';return render()}ui.confirmDel=null;var nc=0;state.members.forEach(function(m){if(m.vikings){m.vikings='';nc++}});toast('Cleared '+nc+' Viking answer'+(nc===1?'':'s')+(cloud.signups&&cloud.signups.some(function(s){return s.vikings})?' (sign-ups waiting on the Sign-up tab are not touched)':''));return touch()}
  if(act==='garmake'){var gs=+(document.getElementById('garsize')||{}).value||3;var k=makeGarrison(e,gs);toast(k+' garrison group'+(k===1?'':'s')+' made');return touch()}
  if(act==='garclear'){e.gar=null;e.garN=0;toast('Garrison groups removed');return touch()}
  if(act==='auto'){autoAssign(e);toast('Line-up created');return touch()}
  if(act==='brief'){var t=briefing(e);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Briefing copied — paste it in alliance chat')},function(){showText(t)})}else showText(t);return}
  if(act==='radd'){e.roles.push({id:uid(),name:'New role',count:5,groups:1,groupLabel:'Group',link:false,rest:false,desc:''});ui.openCfg=true;return touch()}
  if(act==='rdel'){e.roles.splice(+b.getAttribute('data-i'),1);ui.openCfg=true;return touch()}
  if(act==='rup'){var i=+b.getAttribute('data-i');var x=e.roles.splice(i,1)[0];e.roles.splice(i-1,0,x);ui.openCfg=true;return touch()}
  if(act==='rreset'){e.roles=presetRoles(e.type);e.max=(PRESETS[e.type]||PRESETS.custom).max;e.assignment=null;ui.openCfg=true;return touch()}
});
function ev_(id){return ev(id)}
function showText(t){var w=document.createElement('div');w.className='toast';w.style.cssText+='left:16px;max-width:520px;margin-left:auto';w.innerHTML='<div class="row" style="margin-bottom:6px"><b class="grow">Copy manually</b><button class="btn sm">Close</button></div><textarea style="min-height:220px">'+esc(t)+'</textarea>';document.body.appendChild(w);w.querySelector('button').onclick=function(){w.remove()};var ta=w.querySelector('textarea');ta.focus();ta.select()}

root.addEventListener('toggle',function(ev){if(ev.target.hasAttribute&&ev.target.hasAttribute('data-cfg'))ui.openCfg=ev.target.open;if(ev.target.hasAttribute&&ev.target.hasAttribute('data-bulk'))ui.bulkOpen=ev.target.open},true);
root.addEventListener('keydown',function(ev){var t=ev.target;if(ev.key==='Enter'&&t.getAttribute&&t.getAttribute('data-mf')==='power'){ev.preventDefault();var all=[].slice.call(root.querySelectorAll('input[data-mf=power]'));var nx=all[all.indexOf(t)+1];ui.focusNext=nx?nx.getAttribute('data-id'):null;t.blur();if(ui.focusNext){var el=root.querySelector('input[data-mf=power][data-id="'+ui.focusNext+'"]');if(el){el.focus();el.select()}ui.focusNext=null}}});
root.addEventListener('input',function(ev){var t=ev.target;if(t.getAttribute('data-f')==='search'){ui.search=t.value;render()}});
root.addEventListener('change',function(ev){
  var t=ev.target,r=route(),e=r.ev?ev_(r.ev):null;
  if(t.getAttribute('data-f')==='sort'){ui.sort=t.value;return render()}
  if(t.getAttribute('data-f')==='lg'){ui.lg=t.value;return render()}
  var mf=t.getAttribute('data-mf');
  if(mf){var m=member(t.getAttribute('data-id'));if(!m)return;
    if(mf==='name'){var v=t.value.trim();if(v)m.name=v}
    else if(mf==='power')setPower(m,parsePower(t.value));
    else if(mf==='tc'){var v2=parseInt(t.value,10);m.tc=v2>0?v2:undefined}
    else if(mf==='active')m.active=t.checked;
    else if(mf==='legion')m.legion=t.checked?t.getAttribute('data-v'):'';
    return touch()}
  if(t.getAttribute('data-act-change')==='addpart'&&e&&t.value){e.participants.push(t.value);return touch()}
  if(!e)return;
  var ef=t.getAttribute('data-ef');
  if(ef){e[ef]=ef==='max'?Math.max(0,+t.value||0):t.value;return touch()}
  var rf=t.getAttribute('data-rf');
  if(rf){var ro=e.roles[+t.getAttribute('data-i')];ui.openCfg=true;
    if(rf==='usegroups'){if(t.checked){ro.groups=Math.max(2,+ro.prevGroups||2)}else{ro.prevGroups=ro.groups;ro.groups=1}}
    else if(rf==='rest'||rf==='link'){ro[rf]=t.checked;if(rf==='rest'&&t.checked)e.roles.forEach(function(o){if(o!==ro)o.rest=false})}
    else if(rf==='count'||rf==='groups')ro[rf]=Math.max(rf==='groups'?2:0,+t.value||0);
    else ro[rf]=t.value;
    return touch()}
  var gm=t.getAttribute('data-gmove');
  if(gm){e.gar=e.gar||{};if(t.value==='')delete e.gar[gm];else e.gar[gm]=+t.value;return touch()}
  var mv=t.getAttribute('data-move');
  if(mv&&e.assignment){var p=t.value.split(':');e.assignment[mv]={role:p[0],group:+p[1]||0};return touch()}
});

function viewSettings(){
  if(CLOUD){var h='<div class="card"><h2>R4 accounts</h2><p class="muted small">This planner is connected to an online database: everyone sees the same data, live. R4s log in with a username and password. To add an R4: Firebase console → <b>Authentication → Users → Add user</b>, with email <b>username@'+R4_DOMAIN+'</b> (not a real address — nothing is ever sent to it) and a password. They then log in here with just the username. To remove an R4, delete or disable their user there.</p>'+(cloud.user?'<p class="small" style="margin:0">Logged in as <b style="color:var(--gold2)">'+esc(r4Name(cloud.user))+'</b> · <button class="btn sm" data-act="logout">Log out</button></p>':'<button class="btn gold" data-act="login">🔒 R4 login</button>')+'</div>';}
  else{var h='<div class="card"><h2>R4 password</h2>';
  if(!state.lock)h+='<p class="muted small">Set a password so only R4s can change things. Everyone else who opens the file can still see members, events and line-ups, and copy briefings.</p><form class="row" data-form="setpw"><input type="password" name="pw1" placeholder="New password" style="width:200px"><input type="password" name="pw2" placeholder="Repeat password" style="width:200px"><button class="btn gold">Set password</button></form>';
  else if(isLocked())h+='<p class="muted small">This planner is locked. Log in as R4 to make changes.</p><button class="btn gold" data-act="login">🔒 R4 login</button>';
  else h+='<p class="muted small">Password is <b style="color:var(--green)">on</b>. You are logged in as R4 on this device. Change it below, or remove it.</p><form class="row" data-form="setpw"><input type="password" name="pw1" placeholder="New password" style="width:200px"><input type="password" name="pw2" placeholder="Repeat password" style="width:200px"><button class="btn">Change password</button><button type="button" class="btn ghost danger" data-act="rmpw">Remove password</button></form>';
  h+='<p class="muted small" style="margin:10px 0 0">After setting or changing it, click <b>Download file with data</b> and share that new file. The password is stored scrambled (not readable), but this is a lock against changes by ordinary members — not bank-level security: someone with technical knowledge could get around it.</p></div>';
  }
  h+='<div class="card"><div class="row"><h2 class="grow" style="margin:0">✨ What’s new</h2><a href="#whatsnew" class="btn sm" style="text-decoration:none;color:var(--text)">See all updates</a></div><p class="muted small" style="margin:8px 0 0">You’re on <b style="color:var(--gold2)">v'+APP_VERSION+'</b> — '+esc(CHANGELOG[0].title)+'.</p></div>';
  h+='<div class="card"><h2>Alliance</h2><div class="row"><label class="f grow">Alliance name (shown at the top)<input type="text" value="'+esc(state.alliance)+'" data-sf="alliance" placeholder="e.g. [ABC] Iron Knights"></label></div></div>';
  h+='<div class="card"><h2>Discord</h2><p class="muted small">In Discord, right-click a channel (on your phone: long-press) → <b>Copy Link</b>, and paste it here. Used by the “Open in Discord” and “Share on Discord” buttons.</p><div style="display:grid;gap:10px">'
   +'<label class="f">Kingshot Oracle channel link<input type="text" data-sf="oracleUrl" value="'+esc(state.oracleUrl||'')+'" placeholder="https://discord.com/channels/…" style="width:100%"></label>'
   +'<label class="f">Oracle command to copy for you (optional)<input type="text" data-sf="oracleCmd" value="'+esc(state.oracleCmd||'')+'" placeholder="the command you type to show your alliance members" style="width:100%"></label>'
   +'<label class="f">Channel to share the sign-up sheet in (optional)<input type="text" data-sf="shareUrl" value="'+esc(state.shareUrl||'')+'" placeholder="https://discord.com/channels/…" style="width:100%"></label></div></div>';
  h+='<div class="card"><h2>Backup</h2><p class="muted small">Copy all your data as text to keep it somewhere safe, or paste an earlier backup to restore everything.</p><div class="row" style="margin-bottom:10px"><button class="btn" data-sact="export">Copy backup</button></div><textarea id="imp" class="eo" placeholder="Paste a backup here…"></textarea><div class="row" style="margin-top:8px"><button class="btn eo" data-sact="import">Restore backup</button></div></div>';
  h+='<div class="card eo"><h2>Danger zone</h2><p class="muted small">Delete all members and all events'+(CLOUD?' — for everyone':'')+'. The alliance name'+(CLOUD?'':' and R4 password')+' stay. Tip: copy a backup first.</p>'+delBtn('everything','🗑 Delete everything')+'</div>';
  if(/^https?:$/.test(location.protocol)&&!isStandalone)h+='<div class="card"><h2>Install as app</h2><p class="muted small" style="margin:0"><b>Android (Chrome):</b> tap <b>📲 Install app</b> at the top, or the ⋮ menu → <b>Add to Home screen / Install app</b>.<br><b>iPhone (Safari):</b> tap the Share button → <b>Add to Home Screen</b>.<br>The app then opens full-screen from its own icon and also works offline.</p></div>';
  h+='<div class="card"><h2>How does auto-assign work?</h2><p class="muted" style="margin:0">Participants are sorted by power. The strongest players fill the first role (e.g. DPS or Lane Anchor), then the next role, and the role marked “Rest” gets everyone left over, so it fills itself no matter how many participants you have (only one role can be Rest at a time; without a Rest role, leftover players go to Reserve). Above the max. number of main players, the weakest go to Reserve. Within a role, each player goes to the group with the lowest total power, so groups stay balanced. Afterwards you can move anyone manually with the small menu next to their name.</p></div>';
  return h;
}
root.addEventListener('change',function(ev){var t=ev.target,k=t.getAttribute('data-sf');if(!k)return;var v=t.value.trim();if((k==='oracleUrl'||k==='shareUrl')&&v&&!/^(https:\/\/((ptb|canary)\.)?discord(app)?\.com\/|https:\/\/discord\.gg\/|discord:\/\/)/i.test(v))toast('That doesn’t look like a Discord link — saved anyway');state[k]=v;touch()});
root.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-sact]');if(!b)return;var a=b.getAttribute('data-sact');
  if(a==='export'){var t=JSON.stringify({alliance:state.alliance,members:state.members,events:state.events});if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Backup copied')},function(){showText(t)});else showText(t)}
  if(a==='import'){try{var d=JSON.parse(document.getElementById('imp').value);if(!Array.isArray(d.members))throw 0;state.alliance=d.alliance||'';state.members=d.members;state.events=d.events||[];toast('Backup restored');touch()}catch(x){toast('That doesn’t look like a valid backup')}}
});

var installEvt=null,isStandalone=false;try{isStandalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){}
if(/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;render()});
window.addEventListener('appinstalled',function(){installEvt=null;toast('App installed');render()});
root.addEventListener('click',function(ev){var b=ev.target.closest('[data-allow=install]');if(!b||!installEvt)return;installEvt.prompt();installEvt.userChoice.then(function(){installEvt=null;render()})});
root.addEventListener('click',function(ev){
  var cb=ev.target.closest('[data-copy]');if(cb){var rr=route(),ee=rr.ev?ev_(rr.ev):null;if(ee){var txt=copyFor(ee,cb.getAttribute('data-copy'));if(txt)copyText(txt,'Copied — paste it to that group')}return}
  var sb=ev.target.closest('[data-share]');if(sb&&!sb.disabled){ev.preventDefault();shareAction(sb.getAttribute('data-share'));return}
  var t=ev.target.closest('[data-act]'),a=t&&t.getAttribute('data-act');
  if(a==='closesharehelp'){ui.shareHelp=false;render();return}
  if(a==='seenwn'){lsSet('ks-seen-version',APP_VERSION);render();return}
  var su=ev.target.closest('[data-su]');if(su&&!su.disabled){ui.suNoteVal=(root.querySelector('[data-sufield=note]')||{}).value||ui.suNoteVal||'';var pf=root.querySelector('[data-sufield=power]');if(pf)ui.suPowerVal=pf.value;var ty=root.querySelector('[data-sufield=typed]');if(ty)ui.suTyped=ty.value;submitSignup('legion',su.getAttribute('data-su'));return}
  var suc=ev.target.closest('[data-suc]');if(suc&&!suc.disabled){ui.suNoteVal=(root.querySelector('[data-sufield=note]')||{}).value||ui.suNoteVal||'';var pf2=root.querySelector('[data-sufield=power]');if(pf2)ui.suPowerVal=pf2.value;var ty2=root.querySelector('[data-sufield=typed]');if(ty2)ui.suTyped=ty2.value;submitSignup('vikings',suc.getAttribute('data-suc'));return}
});
render();
if(CLOUD)startCloud();
})();
